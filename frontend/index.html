<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>МЭИ.Hub</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hub: {
              50:'#f0f7ff', 100:'#e0effe', 200:'#b9ddfe',
              400:'#4ba3f5', 500:'#1a7fd4', 600:'#0f62b0',
              700:'#0d4f8c', 800:'#0c3d6b', 900:'#0a2d4d',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script>
    // Theme before first paint — must run after tailwind config is known
    (function () {
      try {
        var saved = localStorage.getItem('mpei_hub_theme') || 'system';
        var dark = saved === 'dark' ||
          (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    html { color-scheme: light; }
    html.dark { color-scheme: dark; }

    /* Global motion */
    button, a, .lesson-card, .album-page, .tab-btn {
      transition: background-color .2s ease, color .2s ease, border-color .2s ease,
                  transform .2s cubic-bezier(.22,.68,0,1.2), box-shadow .2s ease, opacity .2s ease;
    }
    button:active:not(:disabled) { transform: scale(.96); }
    button:disabled { cursor: default; }

    .lesson-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,98,176,.1); }
    html.dark .lesson-card:hover { box-shadow: 0 6px 16px rgba(0,0,0,.35); }

    /* Album carousel */
    .album { perspective: 1200px; min-height: 420px; }
    .album-track { display: flex; align-items: stretch; justify-content: center; position: relative; height: 100%; }
    .album-page {
      position: absolute; top: 0; bottom: 0;
      width: min(92%, 420px);
      transition: transform .55s cubic-bezier(.34,1.3,.64,1), opacity .4s ease, filter .4s ease;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .lesson-past {
      opacity: .45; filter: grayscale(.85);
    }
    .lesson-past:hover { opacity: .55; }
    .break-chip {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .35rem 0;
    }
    .break-chip::before, .break-chip::after {
      content: ''; flex: 1; height: 1px;
      background: currentColor; opacity: .2;
    }
    .album-page[data-pos="-2"] { transform: translateX(-118%) scale(.82) rotateY(12deg); opacity: .25; filter: blur(1px); z-index: 1; pointer-events: none; }
    .album-page[data-pos="-1"] { transform: translateX(-72%) scale(.9) rotateY(8deg); opacity: .55; z-index: 2; cursor: pointer; }
    .album-page[data-pos="0"]  { transform: translateX(0) scale(1) rotateY(0); opacity: 1; z-index: 5; }
    .album-page[data-pos="1"]  { transform: translateX(72%) scale(.9) rotateY(-8deg); opacity: .55; z-index: 2; cursor: pointer; }
    .album-page[data-pos="2"]  { transform: translateX(118%) scale(.82) rotateY(-12deg); opacity: .25; filter: blur(1px); z-index: 1; pointer-events: none; }
    .album-page[data-pos="hidden"] { opacity: 0; pointer-events: none; z-index: 0; transform: scale(.7); }

    @media (max-width: 640px) {
      .album-page { width: 88%; }
      .album-page[data-pos="-1"] { transform: translateX(-78%) scale(.88); opacity: .4; }
      .album-page[data-pos="1"]  { transform: translateX(78%) scale(.88); opacity: .4; }
      .album-page[data-pos="-2"],
      .album-page[data-pos="2"] { opacity: 0; pointer-events: none; }
    }

    .tab-bubble {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }

    /* Week picker popover */
    .week-picker {
      animation: popIn .2s cubic-bezier(.22,.68,0,1.2);
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in { animation: fadeIn .25s ease; }

    /* Panel switch */
    .panel-enter { animation: fadeIn .25s ease; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

  <header class="sticky top-0 z-30 border-b border-slate-200/80 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      <a href="/" class="flex items-center gap-2.5 min-w-0 group">
        <img src="/img/logo.svg" alt="" class="w-9 h-9 rounded-xl shadow-sm group-hover:scale-105 transition-transform" />
        <div class="leading-tight">
          <span class="text-lg font-bold tracking-tight">МЭИ<span class="text-hub-500">.</span>Hub</span>
        </div>
      </a>
      <button id="btn-theme" type="button"
              class="p-2.5 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 dark:text-slate-400"
              title="Тема" aria-label="Переключить тему">
        <svg id="icon-theme" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"></svg>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-5 pb-28">

    <section id="panel-schedule" class="panel-enter">
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-4 mb-5">
        <div class="flex flex-wrap gap-3 items-end">
          <div class="flex-1 min-w-[160px]">
            <label for="group-input" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Группа</label>
            <input id="group-input" type="text"
                   class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-hub-400 focus:border-hub-400 outline-none transition"
                   placeholder="ЭРэ-41-26" autocomplete="off" />
          </div>
          <button id="btn-load-schedule"
                  class="bg-hub-600 hover:bg-hub-700 text-white text-sm font-medium px-5 py-2 rounded-xl shadow-sm hover:shadow-md">
            Показать
          </button>
        </div>
        <p id="schedule-meta" class="mt-2 text-[11px] text-slate-400"></p>
      </div>

      <!-- Day + week nav -->
      <div id="day-nav" class="hidden items-center justify-between gap-2 mb-4 relative">
        <button id="btn-prev-day" type="button"
                class="flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 shadow-sm"
                aria-label="Предыдущий день">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <button id="btn-week-pick" type="button"
                class="flex-1 min-w-0 text-center px-3 py-1.5 rounded-xl hover:bg-white dark:hover:bg-slate-900 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 hover:shadow-sm group">
          <p id="day-title" class="font-semibold text-base truncate group-hover:text-hub-600 dark:group-hover:text-hub-400"></p>
          <p id="day-subtitle" class="text-xs text-slate-400 flex items-center justify-center gap-1">
            <span id="day-subtitle-text"></span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </p>
        </button>

        <button id="btn-next-day" type="button"
                class="flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 shadow-sm"
                aria-label="Следующий день">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>

        <!-- Week picker dropdown -->
        <div id="week-picker" class="week-picker hidden absolute left-1/2 -translate-x-1/2 top-full mt-2 z-20
                    w-[min(100%,320px)] bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700
                    shadow-xl p-3">
          <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-2 px-1">Учебная неделя</p>
          <div id="week-list" class="space-y-1 max-h-64 overflow-y-auto"></div>
        </div>
      </div>

      <div id="schedule-container">
        <p class="text-slate-400 text-center py-20 text-sm">Введите группу и нажмите «Показать»</p>
      </div>
    </section>

    <section id="panel-grades" class="hidden panel-enter">
      <div id="auth-box" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-6 max-w-md mx-auto">
        <h2 class="text-lg font-semibold mb-1">Вход в БАРС</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Логин и пароль от bars.mpei.ru</p>
        <form id="login-form" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Логин</label>
            <input id="login-user" type="text" required
                   class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-hub-400 outline-none transition" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Пароль</label>
            <input id="login-pass" type="password" required
                   class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-hub-400 outline-none transition" />
          </div>
          <button type="submit"
                  class="w-full bg-hub-600 hover:bg-hub-700 text-white font-medium py-2.5 rounded-xl text-sm shadow-sm hover:shadow-md">
            Войти
          </button>
          <p id="login-error" class="text-sm text-red-500 hidden"></p>
        </form>
      </div>
      <div id="grades-box" class="hidden">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Успеваемость</h2>
          <button id="btn-logout" class="text-sm text-hub-600 dark:text-hub-400 hover:underline">Выйти</button>
        </div>
        <div id="grades-container"></div>
      </div>
    </section>

    <section id="panel-map" class="hidden panel-enter">
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-8 max-w-lg mx-auto text-center">
        <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-hub-50 dark:bg-hub-900/40 flex items-center justify-center text-hub-600 dark:text-hub-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
        </div>
        <h2 class="text-lg font-semibold mb-1">Карта кампуса</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400">Скоро здесь появятся карты корпусов МЭИ</p>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-40 pb-safe pointer-events-none">
    <div class="max-w-md mx-auto px-4 pb-4 pointer-events-auto">
      <div class="tab-bubble flex items-center justify-around gap-1 px-2 py-2 rounded-2xl
                  bg-white/85 dark:bg-slate-900/85 border border-slate-200/80 dark:border-slate-700/80
                  shadow-[0_8px_30px_rgba(0,0,0,.12)] dark:shadow-[0_8px_30px_rgba(0,0,0,.4)]">
        <button id="tab-schedule" type="button"
                class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 px-2 rounded-xl text-hub-600 dark:text-hub-400 bg-hub-50 dark:bg-hub-900/40">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M3 11h18M5 7h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V9a2 2 0 012-2z"/>
          </svg>
          <span class="text-[10px] font-medium">Расписание</span>
        </button>
        <button id="tab-grades" type="button"
                class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 px-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6m6 0V9a2 2 0 012-2h2a2 2 0 012 2v10m6 0V5a2 2 0 00-2-2h-2a2 2 0 00-2 2v14"/>
          </svg>
          <span class="text-[10px] font-medium">БАРС</span>
        </button>
        <button id="tab-map" type="button"
                class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 px-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          <span class="text-[10px] font-medium">Карта</span>
        </button>
      </div>
    </div>
  </nav>

  <script src="/js/app.js"></script>
</body>
</html>
